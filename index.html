 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Chill, Factor">
    <meta name="keywords" content="HTML, CSS, Chill, Factor">
    <meta name="author" content="Sebastian Vale">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5">
    <title>Chill Factor</title>


		<link rel="icon" type="image/png" href="conecompany2.png">

    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        header {
            display: flex;
            align-items: center;
            width: 100%;
            height: 400px;
            font-size: 50px;
            background-image: linear-gradient(#21D4FD, #B721FF);
            color: white;
        }

        /* LOGO */
        #logocontainer {
            width: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 20px;
        }

        #logocontainer img {
            max-width: 100%;
            max-height: 100%;
        }

        /* NAME */
        #nameofcompany {
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 40px;
        }

        /* BUTTON AREA */
        #buttonholder {
            width: 20%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        #buttonholder button {
            padding: 8px 14px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            background-color: white;
            color: #333;
            cursor: pointer;
        }

        #buttonholder button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>

    <header>
        <div id="logocontainer">
            
            <img src="images/conecompany2.png" alt="Cone Company 2" width="600px" height="200px">
        </div>

        <div id="nameofcompany">
            
        </div>

        <div id="buttonholder">
            
			<center><a href="menu.html"><button>Menu</button></a></center>
            
			
			<center><a href="calander.html"><button>Calendar</button><a></center>
			
			
			<center><a href="contact.html"><button>Contact Us</button><a></center>
	   </div>
    </header>

</body>
</html>
